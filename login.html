<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Penzawa Kemenag Kobar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      background-image: url('background.jpeg'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 bg-emerald-900/50 font-inter">

  <div class="bg-white/90 backdrop-blur-md border border-white/30 rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-md">
    
    <div class="text-center mb-6">
      <h1 class="text-2xl font-extrabold text-emerald-800 font-poppins">Login Admin</h1>
      <p class="text-xs text-gray-600 mt-1">Masukkan akun untuk mengelola berita</p>
    </div>

    <!-- Alert Error -->
    <div id="errorAlert" class="hidden mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-xs rounded-lg text-center"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required placeholder="admin@kemenag.go.id" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <button type="submit" id="btnLogin" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition-all shadow-md">
        Masuk
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-xs text-emerald-700 hover:underline font-medium">← Kembali ke Beranda</a>
    </div>
  </div>

  <!-- Firebase Script Auth -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmQcyj5v0W9Y_vJI9SyqObMWcxqE4xgMo",
      authDomain: "web-penzawa.firebaseapp.com",
      projectId: "web-penzawa",
      storageBucket: "web-penzawa.firebasestorage.app",
      messagingSenderId: "335431617279",
      appId: "1:335431617279:web:1fbaf521074b8855d39aca",
      measurementId: "G-BYNET2Z5WR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Jika pengguna sudah dalam keadaan login, langsung arahkan ke admin-berita.html
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'admin-berita.html';
      }
    });

    const loginForm = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const btnLogin = document.getElementById('btnLogin');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      btnLogin.innerText = "Memproses...";
      btnLogin.disabled = true;

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'admin-berita.html';
      } catch (error) {
        console.error("Gagal login:", error.code);
        let pesanError = "Email atau password salah.";
        if (error.code === 'auth/too-many-requests') {
          pesanError = "Terlalu banyak percobaan gagal. Silakan coba beberapa saat lagi.";
        }
        errorAlert.innerText = pesanError;
        errorAlert.classList.remove('hidden');
      } finally {
        btnLogin.innerText = "Masuk";
        btnLogin.disabled = false;
      }
    });
  </script>
</body>
</html>
