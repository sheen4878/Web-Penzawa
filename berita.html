<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita & Informasi - Penzawa Kemenag Kobar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      background-image: url('background.jpeg'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8 bg-emerald-900/50 font-inter">

  <div class="bg-white/80 backdrop-blur-md border border-white/30 rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-4xl my-8">
    
    <div class="flex flex-col md:flex-row justify-between items-center border-b border-gray-200 pb-6 mb-6 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-emerald-800 font-poppins">Berita & Informasi</h1>
        <p class="text-sm text-gray-600 font-medium">Penyelenggara Zakat & Wakaf Kemenag Kobar</p>
      </div>
      <a href="index.html" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-xl transition-all shadow-md font-poppins">
        ← Kembali ke Kalkulator
      </a>
    </div>

    <!-- Tempat Berita Ditampilkan -->
    <div id="daftarBerita" class="space-y-6">
      <p class="text-center text-gray-500 py-8">Memuat berita dari server...</p>
    </div>

  </div>

  <!-- Firebase Script Terintegrasi -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmQcyj5v0W9Y_vJI9SyqObMWcxqE4xgMo",
      authDomain: "web-penzawa.firebaseapp.com",
      projectId: "web-penzawa",
      storageBucket: "web-penzawa.firebasestorage.app",
      messagingSenderId: "335431617279",
      appId: "1:335431617279:web:1fbaf521074b8855d39aca",
      measurementId: "G-BYNET2Z5WR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function muatBeritaPublik() {
      const container = document.getElementById('daftarBerita');
      
      try {
        const q = query(collection(db, "berita"), orderBy("waktuDibuat", "desc"));
        const querySnapshot = await getDocs(q);

        container.innerHTML = "";
        if (querySnapshot.empty) {
          container.innerHTML = "<p class='text-center text-gray-500 py-8'>Belum ada berita yang dipublikasikan.</p>";
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const berita = docSnap.data();
          const card = document.createElement('div');
          card.className = "bg-white/90 border border-emerald-100 rounded-xl p-6 shadow-sm hover:shadow-md transition-all";
          
          let fotoHtml = "";
          if (berita.foto) {
            fotoHtml = `
              <div class="mb-4 overflow-hidden rounded-lg border border-gray-200 max-h-96 flex justify-center bg-black/5">
                <img src="${berita.foto}" alt="Foto Kegiatan" class="object-cover w-full max-h-96">
              </div>
            `;
          }

          card.innerHTML = `
            <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">${berita.tanggal}</span>
            <h2 class="text-xl font-bold text-emerald-900 font-poppins mt-2 mb-3">${berita.judul}</h2>
            ${fotoHtml}
            <p class="text-gray-700 text-sm leading-relaxed whitespace-pre-line">${berita.isi}</p>
          `;
          container.appendChild(card);
        });

      } catch (error) {
        console.error("Gagal mengambil berita:", error);
        container.innerHTML = "<p class='text-center text-red-500 py-8'>Gagal memuat berita dari server.</p>";
      }
    }

    window.onload = muatBeritaPublik;
  </script>
</body>
</html>
