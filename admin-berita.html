<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Panel Penzawa Kemenag Kobar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      background-image: url('background.jpeg'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      visibility: hidden; 
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8 bg-emerald-900/50 font-inter">

  <div class="bg-white/90 backdrop-blur-md border border-white/30 rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-3xl my-8">
    
    <div class="flex flex-col md:flex-row justify-between items-center border-b border-gray-200 pb-4 mb-6 gap-4">
      <h1 class="text-xl md:text-2xl font-extrabold text-emerald-800 font-poppins">Panel Admin Terpadu</h1>
      
      <div class="flex space-x-3 items-center">
        <a href="index.html" target="_blank" class="text-xs px-4 py-2 bg-emerald-100 text-emerald-800 rounded-lg hover:bg-emerald-200 font-semibold transition-colors">Lihat Website →</a>
        <button id="btnLogout" class="text-xs px-4 py-2 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 font-semibold transition-colors shadow-sm">
          Keluar / Logout
        </button>
      </div>
    </div>

    <!-- Navigasi Tab -->
    <div class="flex space-x-2 border-b border-gray-200 mb-6 pb-2 overflow-x-auto">
      <button onclick="switchTab('berita')" id="tab-berita" class="px-4 py-2 rounded-t-lg bg-emerald-600 text-white font-semibold text-sm whitespace-nowrap">Kelola Berita</button>
      <button onclick="switchTab('pegawai')" id="tab-pegawai" class="px-4 py-2 rounded-t-lg bg-gray-200 text-gray-600 hover:bg-gray-300 font-semibold text-sm whitespace-nowrap">Kelola Pegawai</button>
      <button onclick="switchTab('regulasi')" id="tab-regulasi" class="px-4 py-2 rounded-t-lg bg-gray-200 text-gray-600 hover:bg-gray-300 font-semibold text-sm whitespace-nowrap">Kelola Regulasi</button>
    </div>

    <!-- ========================================== -->
    <!-- TAB 1: BERITA -->
    <!-- ========================================== -->
    <div id="content-berita" class="tab-content active">
      <form id="formBerita" onsubmit="tambahBerita(event)" class="space-y-4">
        <div><label class="block text-sm font-medium mb-1">Judul Berita</label><input type="text" id="judulBerita" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></div>
        <div><label class="block text-sm font-medium mb-1">Tanggal</label><input type="text" id="tanggalBerita" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></div>
        <div><label class="block text-sm font-medium mb-1">Upload Foto</label><input type="file" id="fotoBerita" accept="image/*" class="w-full px-3 py-2 border rounded-lg bg-white"></div>
        <div><label class="block text-sm font-medium mb-1">Isi Berita</label><textarea id="isiBerita" rows="4" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500"></textarea></div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 transition-colors text-white font-semibold py-2.5 rounded-lg">Publikasikan Berita</button>
      </form>
      <!-- Daftar Berita yang sudah diupload -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <h2 class="text-lg font-bold text-emerald-800 font-poppins mb-4">Daftar Berita Tersimpan</h2>
        <div id="listAdminBerita" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- TAB 2: PEGAWAI -->
    <!-- ========================================== -->
    <div id="content-pegawai" class="tab-content">
      <form id="formPegawai" onsubmit="tambahPegawai(event)" class="space-y-4">
        <div><label class="block text-sm font-medium mb-1">Nama Pegawai</label><input type="text" id="namaPegawai" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500"></div>
        <div><label class="block text-sm font-medium mb-1">NIP</label><input type="text" id="nipPegawai" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500"></div>
        <div><label class="block text-sm font-medium mb-1">Jabatan</label><input type="text" id="jabatanPegawai" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500"></div>
        <div><label class="block text-sm font-medium mb-1">Foto Pegawai</label><input type="file" id="fotoPegawai" accept="image/*" class="w-full px-3 py-2 border rounded-lg bg-white"></div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 transition-colors text-white font-semibold py-2.5 rounded-lg">Simpan Pegawai</button>
      </form>
      <!-- Daftar Pegawai yang sudah diupload -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <h2 class="text-lg font-bold text-emerald-800 font-poppins mb-4">Daftar Pegawai Tersimpan</h2>
        <div id="listAdminPegawai" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
      </div>
    </div>

    <!-- ========================================== -->
    <!-- TAB 3: REGULASI -->
    <!-- ========================================== -->
    <div id="content-regulasi" class="tab-content">
      <form id="formRegulasi" onsubmit="tambahRegulasi(event)" class="space-y-4">
        <div><label class="block text-sm font-medium mb-1">Judul Regulasi</label><input type="text" id="judulRegulasi" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500"></div>
        <div><label class="block text-sm font-medium mb-1">Tahun/Nomor</label><input type="text" id="nomorRegulasi" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500"></div>
        <div><label class="block text-sm font-medium mb-1">File Regulasi (PDF/DOC)</label><input type="file" id="fileRegulasi" class="w-full px-3 py-2 border rounded-lg bg-white"></div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 transition-colors text-white font-semibold py-2.5 rounded-lg">Upload Regulasi</button>
      </form>
      <!-- Daftar Regulasi yang sudah diupload -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <h2 class="text-lg font-bold text-emerald-800 font-poppins mb-4">Daftar Regulasi Tersimpan</h2>
        <div id="listAdminRegulasi" class="space-y-3 max-h-60 overflow-y-auto pr-2"></div>
      </div>
    </div>

  </div>

  <!-- SCRIPT FIREBASE LOGIN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmQcyj5v0W9Y_vJI9SyqObMWcxqE4xgMo",
      authDomain: "web-penzawa.firebaseapp.com",
      projectId: "web-penzawa",
      storageBucket: "web-penzawa.firebasestorage.app",
      messagingSenderId: "335431617279",
      appId: "1:335431617279:web:1fbaf521074b8855d39aca",
      measurementId: "G-BYNET2Z5WR"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        document.body.style.visibility = 'visible';
        muatSemuaData(); // Panggil data saat user dikonfirmasi berhasil login
      }
    });

    document.getElementById('btnLogout').addEventListener('click', () => {
      if(confirm("Apakah Anda yakin ingin keluar dari Panel Admin?")) {
        signOut(auth).then(() => window.location.href = 'login.html');
      }
    });
  </script>

  <!-- SCRIPT KELOLA DATA (CRUD) -->
  <script>
    function switchTab(tabId) {
      ['berita', 'pegawai', 'regulasi'].forEach(id => {
        document.getElementById('content-' + id).classList.remove('active');
        document.getElementById('tab-' + id).classList.replace('bg-emerald-600', 'bg-gray-200');
        document.getElementById('tab-' + id).classList.replace('text-white', 'text-gray-600');
      });
      document.getElementById('content-' + tabId).classList.add('active');
      document.getElementById('tab-' + tabId).classList.replace('bg-gray-200', 'bg-emerald-600');
      document.getElementById('tab-' + tabId).classList.replace('text-gray-600', 'text-white');
    }

    // FUNGSI TAMPILKAN DAFTAR DATA
    function muatSemuaData() {
      tampilkanList('listBeritaKemenag', 'listAdminBerita', 'judul', 'Belum ada berita tersimpan.');
      tampilkanList('listPegawaiKemenag', 'listAdminPegawai', 'nama', 'Belum ada data pegawai tersimpan.');
      tampilkanList('listRegulasiKemenag', 'listAdminRegulasi', 'judul', 'Belum ada regulasi tersimpan.');
    }

    function tampilkanList(storageKey, containerId, titleKey, emptyMsg) {
      const container = document.getElementById(containerId);
      let data = JSON.parse(localStorage.getItem(storageKey)) || [];
      
      container.innerHTML = "";
      if (data.length === 0) {
        container.innerHTML = `<p class='text-sm text-gray-500'>${emptyMsg}</p>`;
        return;
      }

      data.forEach((item, index) => {
        container.innerHTML += `
          <div class="flex justify-between items-center p-3 bg-gray-50 border rounded-lg text-sm">
            <span class="font-medium text-gray-800 truncate max-w-xs">${item[titleKey]}</span>
            <button onclick="hapusData('${storageKey}', ${index})" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded text-xs font-semibold">Hapus</button>
          </div>
        `;
      });
    }

    // FUNGSI HAPUS DATA
    function hapusData(storageKey, index) {
      if (confirm("Apakah Anda yakin ingin menghapus data ini?")) {
        let data = JSON.parse(localStorage.getItem(storageKey)) || [];
        data.splice(index, 1);
        localStorage.setItem(storageKey, JSON.stringify(data));
        muatSemuaData(); // Refresh daftar setelah dihapus
        alert("Data berhasil dihapus.");
      }
    }

    // FUNGSI TAMBAH DATA
    function tambahBerita(e) {
      e.preventDefault();
      simpanData('listBeritaKemenag', {
        judul: document.getElementById('judulBerita').value,
        tanggal: document.getElementById('tanggalBerita').value,
        isi: document.getElementById('isiBerita').value
      }, document.getElementById('fotoBerita').files[0], 'formBerita');
    }

    function tambahPegawai(e) {
      e.preventDefault();
      simpanData('listPegawaiKemenag', {
        nama: document.getElementById('namaPegawai').value,
        nip: document.getElementById('nipPegawai').value,
        jabatan: document.getElementById('jabatanPegawai').value
      }, document.getElementById('fotoPegawai').files[0], 'formPegawai');
    }

    function tambahRegulasi(e) {
      e.preventDefault();
      simpanData('listRegulasiKemenag', {
        judul: document.getElementById('judulRegulasi').value,
        nomor: document.getElementById('nomorRegulasi').value
      }, document.getElementById('fileRegulasi').files[0], 'formRegulasi');
    }

    function simpanData(storageKey, dataObj, fileInput, formId) {
      let dataStore = JSON.parse(localStorage.getItem(storageKey)) || [];
      if (fileInput) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          dataObj.file = evt.target.result;
          dataObj.foto = evt.target.result; // Menyesuaikan dengan format berita sebelumnya
          dataStore.unshift(dataObj);
          localStorage.setItem(storageKey, JSON.stringify(dataStore));
          alert("Data berhasil disimpan!");
          document.getElementById(formId).reset();
          muatSemuaData(); // Refresh daftar setelah ditambah
        };
        reader.readAsDataURL(fileInput);
      } else {
        dataObj.file = "";
        dataObj.foto = "";
        dataStore.unshift(dataObj);
        localStorage.setItem(storageKey, JSON.stringify(dataStore));
        alert("Data berhasil disimpan!");
        document.getElementById(formId).reset();
        muatSemuaData(); // Refresh daftar setelah ditambah
      }
    }
  </script>
</body>
</html>
