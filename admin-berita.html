<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Upload Berita (Firebase)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body {
      background-image: url('background.jpeg'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8 bg-emerald-900/50 font-inter">

  <div class="bg-white/90 backdrop-blur-md border border-white/30 rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-2xl my-8">
    
    <!-- Header dengan Tombol Logout dan Link Berita -->
    <div class="flex justify-between items-center border-b border-gray-200 pb-4 mb-6">
      <div>
        <h1 class="text-xl md:text-2xl font-extrabold text-emerald-800 font-poppins">Admin Panel</h1>
        <a href="berita.html" target="_blank" class="text-xs text-emerald-600 hover:underline font-semibold">Lihat Berita →</a>
      </div>
      <button id="logoutBtn" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg transition-all shadow">
        Keluar (Logout)
      </button>
    </div>

    <!-- Form Upload -->
    <form id="formBerita" onsubmit="tambahBerita(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Judul Berita</label>
        <input type="text" id="judulBerita" required placeholder="Judul berita..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
        <input type="text" id="tanggalBerita" required placeholder="Contoh: 09 Juni 2026" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Foto Kegiatan</label>
        <input type="file" id="fotoBerita" accept="image/*" class="w-full px-3 py-2 border rounded-lg bg-white text-sm">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Isi Berita</label>
        <textarea id="isiBerita" rows="5" required placeholder="Tulis isi berita..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition-all shadow-md">
        Publikasikan ke Cloud
      </button>
    </form>

    <!-- Daftar Berita untuk Hapus -->
    <div class="mt-8 pt-6 border-t border-gray-200">
      <h2 class="text-lg font-bold text-emerald-800 font-poppins mb-4">Daftar Berita Aktif</h2>
      <div id="listAdminBerita" class="space-y-3 max-h-60 overflow-y-auto pr-2">
        <p class="text-sm text-gray-500 text-center">Memuat data...</p>
      </div>
    </div>
  </div>

  <!-- Firebase Script Terintegrasi dengan Auth Guard -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDmQcyj5v0W9Y_vJI9SyqObMWcxqE4xgMo",
      authDomain: "web-penzawa.firebaseapp.com",
      projectId: "web-penzawa",
      storageBucket: "web-penzawa.firebasestorage.app",
      messagingSenderId: "335431617279",
      appId: "1:335431617279:web:1fbaf521074b8855d39aca",
      measurementId: "G-BYNET2Z5WR"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // 1. Lindungi Halaman: Cek status login pengguna
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // Jika belum login, paksa arahkan ke halaman login
        window.location.href = 'login.html';
      } else {
        // Jika sudah login, muat data admin
        muatDataAdmin();
      }
    });

    // 2. Fungsi Tombol Logout
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try {
        await signOut(auth);
        window.location.href = 'login.html';
      } catch (error) {
        console.error("Gagal keluar:", error);
      }
    });

    window.tambahBerita = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Mengunggah...";
      btn.disabled = true;

      const judul = document.getElementById('judulBerita').value;
      const tanggal = document.getElementById('tanggalBerita').value;
      const isi = document.getElementById('isiBerita').value;
      const fileInput = document.getElementById('fotoBerita');

      let fotoBase64 = "";
      if (fileInput.files && fileInput.files[0]) {
        fotoBase64 = await toBase64(fileInput.files[0]);
      }

      try {
        await addDoc(collection(db, "berita"), {
          judul,
          tanggal,
          isi,
          foto: fotoBase64,
          waktuDibuat: serverTimestamp()
        });
        alert("Berita berhasil dipublikasikan secara online!");
        document.getElementById('formBerita').reset();
        muatDataAdmin();
      } catch (error) {
        console.error("Gagal menambah berita: ", error);
        alert("Terjadi kesalahan saat mengunggah. Pastikan Anda sudah login.");
      } finally {
        btn.innerText = "Publikasikan ke Cloud";
        btn.disabled = false;
      }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    async function muatDataAdmin() {
      const container = document.getElementById('listAdminBerita');
      container.innerHTML = "<p class='text-sm text-gray-500 text-center'>Memuat...</p>";
      
      try {
        const q = query(collection(db, "berita"), orderBy("waktuDibuat", "desc"));
        const querySnapshot = await getDocs(q);
        
        container.innerHTML = "";
        if (querySnapshot.empty) {
          container.innerHTML = "<p class='text-sm text-gray-500 text-center'>Belum ada berita.</p>";
          return;
        }

        querySnapshot.forEach((documentSnap) => {
          const item = documentSnap.data();
          const id = documentSnap.id;

          const div = document.createElement('div');
          div.className = "flex justify-between items-center p-3 bg-gray-50 border rounded-lg text-sm";
          div.innerHTML = `
            <span class="font-medium text-gray-800 truncate max-w-xs">${item.judul}</span>
            <button onclick="hapusBerita('${id}')" class="px-3 py-1 bg-red-500 hover:bg-red-600 text-white rounded text-xs font-semibold">Hapus</button>
          `;
          container.appendChild(div);
        });
      } catch (error) {
        console.error("Gagal memuat:", error);
      }
    }

    window.hapusBerita = async function(id) {
      if (confirm("Yakin ingin menghapus berita ini dari database?")) {
        try {
          await deleteDoc(doc(db, "berita", id));
          alert("Berita berhasil dihapus.");
          muatDataAdmin();
        } catch (error) {
          console.error("Gagal menghapus: ", error);
          alert("Gagal menghapus. Pastikan Anda memiliki izin akses.");
        }
      }
    }
  </script>
</body>
</html>
